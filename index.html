<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Laberintos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Para evitar el scroll al dibujar en pantallas táctiles */
        .touch-none {
            touch-action: none;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-900 text-gray-100 flex flex-col items-center justify-center p-4">

    <div class="max-w-6xl w-full bg-gray-800 rounded-2xl shadow-2xl p-6 md:p-8 flex flex-col md:flex-row gap-8">
        
        <!-- Panel de Controles -->
        <div class="w-full md:w-1/3 flex flex-col gap-6">
            <div>
                <h1 class="text-3xl font-bold text-white mb-2">Laberinto 3 Caminos</h1>
                <p class="text-gray-400 text-sm">Genera un laberinto con 1 ruta correcta y 2 trampas masivas. Dibuja encima para resolverlo, al descargar obtendrás la versión limpia.</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label for="cols" class="block text-sm font-medium text-gray-300 mb-1">Columnas (Mínimo 5)</label>
                    <input type="number" id="cols" min="5" max="60" value="25" 
                        class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-white">
                </div>
                
                <div>
                    <label for="rows" class="block text-sm font-medium text-gray-300 mb-1">Filas</label>
                    <input type="number" id="rows" min="5" max="60" value="25" 
                        class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-white">
                </div>

                <div>
                    <label for="cellSize" class="block text-sm font-medium text-gray-300 mb-1">Tamaño de celda (px)</label>
                    <input type="number" id="cellSize" min="10" max="50" value="20" 
                        class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-white">
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="flex flex-col gap-3 mt-4">
                <div class="flex gap-3">
                    <button id="btnGenerate" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                        <span class="hidden sm:inline">Generar</span>
                    </button>
                    <button id="btnDownload" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg>
                        <span class="hidden sm:inline">Descargar</span>
                    </button>
                </div>
                <!-- Nuevo botón de limpiar trazo -->
                <button id="btnClearDraw" class="w-full bg-red-600 hover:bg-red-500 text-white font-semibold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                    <span>Limpiar Trazo</span>
                </button>
            </div>
        </div>

        <!-- Área del Canvas (Doble capa) -->
        <div class="w-full md:w-2/3 flex items-center justify-center bg-gray-900 rounded-xl border border-gray-700 p-4 overflow-hidden">
            <div id="canvasContainer" class="relative mx-auto shadow-[0_0_20px_rgba(0,0,0,0.4)] rounded-lg">
                <!-- Capa Base: Laberinto -->
                <canvas id="mazeCanvas" class="absolute top-0 left-0 w-full h-full rounded-lg"></canvas>
                <!-- Capa Superior: Dibujo interactivo -->
                <canvas id="drawCanvas" class="absolute top-0 left-0 w-full h-full rounded-lg cursor-crosshair touch-none"></canvas>
            </div>
        </div>

    </div>

    <!-- Script de lógica -->
    <script>
        const container = document.getElementById('canvasContainer');
        const mazeCanvas = document.getElementById('mazeCanvas');
        const drawCanvas = document.getElementById('drawCanvas');
        
        const ctxMaze = mazeCanvas.getContext('2d');
        const ctxDraw = drawCanvas.getContext('2d');
        
        const btnGenerate = document.getElementById('btnGenerate');
        const btnDownload = document.getElementById('btnDownload');
        const btnClearDraw = document.getElementById('btnClearDraw');
        
        let cols, rows, w;
        let grid = [];
        
        class Cell {
            constructor(i, j) {
                this.i = i;
                this.j = j;
                this.walls = [true, true, true, true]; 
                this.visited = false;
            }

            checkNeighbors() {
                let neighbors = [];
                let top = grid[index(this.i, this.j - 1)];
                let right = grid[index(this.i + 1, this.j)];
                let bottom = grid[index(this.i, this.j + 1)];
                let left = grid[index(this.i - 1, this.j)];

                if (top && !top.visited) neighbors.push(top);
                if (right && !right.visited) neighbors.push(right);
                if (bottom && !bottom.visited) neighbors.push(bottom);
                if (left && !left.visited) neighbors.push(left);

                if (neighbors.length > 0) {
                    let r = Math.floor(Math.random() * neighbors.length);
                    return neighbors[r];
                } else {
                    return undefined;
                }
            }

            draw() {
                let x = this.i * w;
                let y = this.j * w;
                
                ctxMaze.strokeStyle = '#000000';
                ctxMaze.lineWidth = 2;
                ctxMaze.lineCap = 'square';
                
                ctxMaze.beginPath();
                if (this.walls[0]) { ctxMaze.moveTo(x, y); ctxMaze.lineTo(x + w, y); } 
                if (this.walls[1]) { ctxMaze.moveTo(x + w, y); ctxMaze.lineTo(x + w, y + w); } 
                if (this.walls[2]) { ctxMaze.moveTo(x + w, y + w); ctxMaze.lineTo(x, y + w); } 
                if (this.walls[3]) { ctxMaze.moveTo(x, y + w); ctxMaze.lineTo(x, y); } 
                ctxMaze.stroke();
            }
        }

        function index(i, j) {
            if (i < 0 || j < 0 || i > cols - 1 || j > rows - 1) {
                return -1;
            }
            return i + j * cols;
        }

        function removeWalls(a, b) {
            let x = a.i - b.i;
            if (x === 1) {
                a.walls[3] = false;
                b.walls[1] = false;
            } else if (x === -1) {
                a.walls[1] = false;
                b.walls[3] = false;
            }
            let y = a.j - b.j;
            if (y === 1) {
                a.walls[0] = false;
                b.walls[2] = false;
            } else if (y === -1) {
                a.walls[2] = false;
                b.walls[0] = false;
            }
        }

        function generateMaze() {
            cols = parseInt(document.getElementById('cols').value);
            rows = parseInt(document.getElementById('rows').value);
            w = parseInt(document.getElementById('cellSize').value);

            if(cols < 5) cols = 5; if(cols > 150) cols = 150;
            if(rows < 5) rows = 5; if(rows > 150) rows = 150;
            if(w < 5) w = 5; if(w > 100) w = 100;

            const padding = 20; 
            const totalWidth = (cols * w) + (padding * 2);
            const totalHeight = (rows * w) + (padding * 2);

            mazeCanvas.width = totalWidth;
            mazeCanvas.height = totalHeight;
            drawCanvas.width = totalWidth;
            drawCanvas.height = totalHeight;

            container.style.width = '100%';
            container.style.maxWidth = totalWidth + 'px';
            container.style.aspectRatio = `${totalWidth} / ${totalHeight}`;

            ctxDraw.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            
            ctxMaze.fillStyle = '#ffffff';
            ctxMaze.fillRect(0, 0, mazeCanvas.width, mazeCanvas.height);

            ctxMaze.save();
            ctxMaze.translate(padding, padding);

            grid = [];
            for (let j = 0; j < rows; j++) {
                for (let i = 0; i < cols; i++) {
                    let cell = new Cell(i, j);
                    grid.push(cell);
                }
            }

            let startX = Math.floor(cols / 2);
            let startY = 0;
            let startCell = grid[index(startX, startY)];
            
            startCell.visited = true;
            startCell.walls[0] = false; 

            let initialNeighbors = [];
            if (startX > 0) initialNeighbors.push(grid[index(startX - 1, startY)]);
            if (startX < cols - 1) initialNeighbors.push(grid[index(startX + 1, startY)]);
            if (rows > 1) initialNeighbors.push(grid[index(startX, startY + 1)]);

            initialNeighbors.sort(() => Math.random() - 0.5);

            let stack = [];

            for (let n of initialNeighbors) {
                if (n) {
                    removeWalls(startCell, n);
                    n.visited = true;
                    stack.push(n);
                }
            }

            while (stack.length > 0) {
                let current = stack.pop();
                let next = current.checkNeighbors();
                if (next) {
                    stack.push(current); 
                    removeWalls(current, next);
                    next.visited = true;
                    stack.push(next);
                }
            }

            let endX = Math.floor(cols / 2);
            let endY = rows - 1;
            grid[index(endX, endY)].walls[2] = false;

            for (let i = 0; i < grid.length; i++) {
                grid[i].draw();
            }

            ctxMaze.fillStyle = '#10b981'; 
            ctxMaze.fillRect(startX * w + w*0.2, -w*0.2, w*0.6, w*0.4);
            
            ctxMaze.fillStyle = '#ef4444'; 
            ctxMaze.fillRect(endX * w + w*0.2, endY * w + w - w*0.2, w*0.6, w*0.4);

            ctxMaze.restore();
        }

        let isDrawing = false;

        function getPointerPos(e) {
            const rect = drawCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const scaleX = drawCanvas.width / rect.width;
            const scaleY = drawCanvas.height / rect.height;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startDraw(e) {
            e.preventDefault(); 
            isDrawing = true;
            const pos = getPointerPos(e);
            ctxDraw.beginPath();
            ctxDraw.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getPointerPos(e);
            
            ctxDraw.lineTo(pos.x, pos.y);
            ctxDraw.strokeStyle = 'rgba(239, 68, 68, 0.8)'; 
            ctxDraw.lineWidth = w * 0.4; 
            ctxDraw.lineCap = 'round';
            ctxDraw.lineJoin = 'round';
            ctxDraw.stroke();
        }

        function stopDraw(e) {
            if (e) e.preventDefault();
            isDrawing = false;
            ctxDraw.closePath();
        }

        drawCanvas.addEventListener('mousedown', startDraw);
        drawCanvas.addEventListener('mousemove', draw);
        drawCanvas.addEventListener('mouseup', stopDraw);
        drawCanvas.addEventListener('mouseout', stopDraw);

        drawCanvas.addEventListener('touchstart', startDraw, { passive: false });
        drawCanvas.addEventListener('touchmove', draw, { passive: false });
        drawCanvas.addEventListener('touchend', stopDraw);

        function downloadMaze() {
            const link = document.createElement('a');
            link.download = `laberinto-limpio-${cols}x${rows}.png`;
            link.href = mazeCanvas.toDataURL('image/png');
            link.click();
        }

        // Nueva función para limpiar el trazo del usuario
        function clearDrawing() {
            ctxDraw.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        }

        btnGenerate.addEventListener('click', generateMaze);
        btnDownload.addEventListener('click', downloadMaze);
        btnClearDraw.addEventListener('click', clearDrawing);

        window.onload = generateMaze;

    </script>
</body>
</html>
