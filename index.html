<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Laberintos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 0.5rem;
            background-color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="min-h-screen bg-gray-900 text-gray-100 flex flex-col items-center justify-center p-4">

    <div class="max-w-5xl w-full bg-gray-800 rounded-2xl shadow-2xl p-6 md:p-8 flex flex-col md:flex-row gap-8">
        
        <!-- Panel de Controles -->
        <div class="w-full md:w-1/3 flex flex-col gap-6">
            <div>
                <h1 class="text-3xl font-bold text-white mb-2">Laberinto 3 Caminos</h1>
                <p class="text-gray-400 text-sm">Genera un laberinto perfecto con 1 ruta correcta y 2 trampas masivas desde el inicio.</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label for="cols" class="block text-sm font-medium text-gray-300 mb-1">Columnas (Mínimo 5)</label>
                    <input type="number" id="cols" min="5" max="60" value="25" 
                        class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-white">
                </div>
                
                <div>
                    <label for="rows" class="block text-sm font-medium text-gray-300 mb-1">Filas</label>
                    <input type="number" id="rows" min="5" max="60" value="25" 
                        class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-white">
                </div>

                <div>
                    <label for="cellSize" class="block text-sm font-medium text-gray-300 mb-1">Tamaño de celda (px)</label>
                    <input type="number" id="cellSize" min="10" max="50" value="20" 
                        class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-white">
                </div>
            </div>

            <div class="flex flex-col gap-3 mt-4">
                <button id="btnGenerate" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    Generar Laberinto
                </button>
                <button id="btnDownload" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    Descargar PNG
                </button>
            </div>
        </div>

        <!-- Área del Canvas -->
        <div class="w-full md:w-2/3 flex items-center justify-center bg-gray-900 rounded-xl border border-gray-700 p-4 overflow-hidden relative">
            <canvas id="mazeCanvas"></canvas>
        </div>

    </div>

    <!-- Script de lógica -->
    <script>
        const canvas = document.getElementById('mazeCanvas');
        const ctx = canvas.getContext('2d');
        const btnGenerate = document.getElementById('btnGenerate');
        const btnDownload = document.getElementById('btnDownload');
        
        let cols, rows, w;
        let grid = [];
        
        class Cell {
            constructor(i, j) {
                this.i = i;
                this.j = j;
                // Paredes: [Arriba, Derecha, Abajo, Izquierda]
                this.walls = [true, true, true, true];
                this.visited = false;
            }

            checkNeighbors() {
                let neighbors = [];
                let top = grid[index(this.i, this.j - 1)];
                let right = grid[index(this.i + 1, this.j)];
                let bottom = grid[index(this.i, this.j + 1)];
                let left = grid[index(this.i - 1, this.j)];

                if (top && !top.visited) neighbors.push(top);
                if (right && !right.visited) neighbors.push(right);
                if (bottom && !bottom.visited) neighbors.push(bottom);
                if (left && !left.visited) neighbors.push(left);

                if (neighbors.length > 0) {
                    let r = Math.floor(Math.random() * neighbors.length);
                    return neighbors[r];
                } else {
                    return undefined;
                }
            }

            draw() {
                let x = this.i * w;
                let y = this.j * w;
                
                ctx.strokeStyle = '#000000'; // Paredes negras
                ctx.lineWidth = 2;
                ctx.lineCap = 'square';
                
                ctx.beginPath();
                if (this.walls[0]) { ctx.moveTo(x, y); ctx.lineTo(x + w, y); } // Top
                if (this.walls[1]) { ctx.moveTo(x + w, y); ctx.lineTo(x + w, y + w); } // Right
                if (this.walls[2]) { ctx.moveTo(x + w, y + w); ctx.lineTo(x, y + w); } // Bottom
                if (this.walls[3]) { ctx.moveTo(x, y + w); ctx.lineTo(x, y); } // Left
                ctx.stroke();
            }
        }

        function index(i, j) {
            if (i < 0 || j < 0 || i > cols - 1 || j > rows - 1) {
                return -1;
            }
            return i + j * cols;
        }

        function removeWalls(a, b) {
            let x = a.i - b.i;
            if (x === 1) {
                a.walls[3] = false;
                b.walls[1] = false;
            } else if (x === -1) {
                a.walls[1] = false;
                b.walls[3] = false;
            }
            let y = a.j - b.j;
            if (y === 1) {
                a.walls[0] = false;
                b.walls[2] = false;
            } else if (y === -1) {
                a.walls[2] = false;
                b.walls[0] = false;
            }
        }

        function generateMaze() {
            cols = parseInt(document.getElementById('cols').value);
            rows = parseInt(document.getElementById('rows').value);
            w = parseInt(document.getElementById('cellSize').value);

            if(cols < 5) cols = 5; if(cols > 150) cols = 150;
            if(rows < 5) rows = 5; if(rows > 150) rows = 150;
            if(w < 5) w = 5; if(w > 100) w = 100;

            const padding = 20; 
            canvas.width = (cols * w) + (padding * 2);
            canvas.height = (rows * w) + (padding * 2);

            // Fondo blanco
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.translate(padding, padding);

            grid = [];
            for (let j = 0; j < rows; j++) {
                for (let i = 0; i < cols; i++) {
                    let cell = new Cell(i, j);
                    grid.push(cell);
                }
            }

            // === LÓGICA DE 3 RUTAS INICIALES (1 CORRECTA, 2 TRAMPAS) ===
            let startX = Math.floor(cols / 2);
            let startY = 0;
            let startCell = grid[index(startX, startY)];
            
            // Marcar el inicio y abrir la pared superior
            startCell.visited = true;
            startCell.walls[0] = false; 

            // Obtener los 3 vecinos del inicio (Izquierda, Derecha, Abajo)
            let initialNeighbors = [];
            if (startX > 0) initialNeighbors.push(grid[index(startX - 1, startY)]);
            if (startX < cols - 1) initialNeighbors.push(grid[index(startX + 1, startY)]);
            if (rows > 1) initialNeighbors.push(grid[index(startX, startY + 1)]);

            // Aleatorizar el orden de las ramas
            initialNeighbors.sort(() => Math.random() - 0.5);

            let stack = [];

            // Romper paredes hacia las 3 ramas y agregarlas al stack de DFS
            for (let n of initialNeighbors) {
                if (n) {
                    removeWalls(startCell, n);
                    n.visited = true;
                    stack.push(n);
                }
            }

            // Continuar con Recursive Backtracking normal
            while (stack.length > 0) {
                let current = stack.pop();
                let next = current.checkNeighbors();
                if (next) {
                    // Si tiene vecinos, lo regresamos a la pila para explorarlo luego
                    stack.push(current); 
                    removeWalls(current, next);
                    next.visited = true;
                    stack.push(next);
                }
            }

            // Crear Salida
            let endX = Math.floor(cols / 2);
            let endY = rows - 1;
            grid[index(endX, endY)].walls[2] = false;

            // Dibujar todo el laberinto
            for (let i = 0; i < grid.length; i++) {
                grid[i].draw();
            }

            // Pintar los indicadores
            // Entrada (Verde)
            ctx.fillStyle = '#10b981'; // Emerald 500
            ctx.fillRect(startX * w + w*0.2, -w*0.2, w*0.6, w*0.4);
            
            // Salida (Rojo)
            ctx.fillStyle = '#ef4444'; // Red 500
            ctx.fillRect(endX * w + w*0.2, endY * w + w - w*0.2, w*0.6, w*0.4);

            ctx.setTransform(1, 0, 0, 1, 0, 0);
        }

        function downloadMaze() {
            const link = document.createElement('a');
            link.download = `laberinto-trampas-${cols}x${rows}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        btnGenerate.addEventListener('click', generateMaze);
        btnDownload.addEventListener('click', downloadMaze);

        // Auto-generar al cargar
        window.onload = generateMaze;

    </script>
</body>
</html>
